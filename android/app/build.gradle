
import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.example.mawadk"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    testCoverage {
        jacocoVersion = "0.8.12"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

        // Define signing configurations
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.azsystem.mawaeid"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Define flavors dimension
    // flavorDimensions "environment"
    
    // // Define product flavors
    // productFlavors {
    //     dev {
    //         dimension "environment"
    //         applicationIdSuffix ""
    //         versionNameSuffix ""
    //     }
        
    //     prod {
    //         dimension "environment"
    //         applicationIdSuffix ""  // No suffix for production
    //         versionNameSuffix ""    // No suffix for production
            
    //     }
    // }

     buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'src/main/proguard-rules.pro'
        }
        
        debug {
            signingConfig signingConfigs.debug
            shrinkResources false
            minifyEnabled false
            debuggable true
        }
    }
}

flutter {
    source = "../.."
}
